<div class="main-container">
  <div class="section-pane">
    <div class="config-wrapper">
      <div class="control-group">
        <label>Tanggal Awal:</label>
        <app-calendar mode="single" placeholder="Set Min Date" [maxDate]="filterMaxDate"
          (dateChange)="onMinChange($event)">
        </app-calendar>
      </div>
      <div class="control-group">
        <label>Tanggal Akhir:</label>
        <app-calendar mode="single" placeholder="Set Max Date" [minDate]="filterMinDate"
          (dateChange)="onMaxChange($event)">
        </app-calendar>
      </div>
    </div>

    <h3>Pilih Rentang Tanggal</h3>
    <app-calendar mode="range" placeholder="Pilih Rentang" [minDate]="filterMinDate" [maxDate]="filterMaxDate"
      (dateChange)="handleMainSelection($event)">
    </app-calendar>
  </div>

  <div class="section-pane">
    <h3>Pemilihan Satu Tanggal:</h3>
    <app-calendar mode="single">
    </app-calendar>
  </div>

  <div class="section-pane section-pane--padded">
    <div class="form-group">
      <label>(dd/mm/yyyy - dd/mm/yyyy):</label>
      <input type="text" [(ngModel)]="userDateInput" class="form-input" placeholder="Contoh: 01/01/2026 - 05/01/2026">
    </div>

    <div class="form-group">
      <label>Kalender:</label>
      <app-calendar mode="range" [modelValue]="userDateInput" (dateChange)="onCalendarChange($event)">
      </app-calendar>
    </div>
  </div>

  <div class="section-pane styled-container">
    <h3>Kalender String</h3>

    <div class="config-box">
      <div class="config-item">
        <label>Set Batas Min:</label>
        <input type="text" [(ngModel)]="minLimitStr" class="form-input" placeholder="dd/mm/yyyy">
      </div>
      <div class="config-item">
        <label>Set Batas Max:</label>
        <input type="text" [(ngModel)]="maxLimitStr" class="form-input" placeholder="dd/mm/yyyy">
      </div>
    </div>

    <hr class="divider">

    <div class="calendar-result-wrapper">
      <app-calendar mode="range" [modelValue]="mainRangeStr" [minDate]="minLimitStr" [maxDate]="maxLimitStr"
        (dateChange)="onMainRangeChange($event)">
      </app-calendar>
    </div>

  </div>

  <div>
    <app-file-upload accept=".PDF, .DOCX" [maxSizeMB]="10">
    </app-file-upload>
  </div>
  <div>
    <app-file-upload [multiple]="true" [maxFiles]="3" [maxSizeMB]="2" accept=".PDF">
    </app-file-upload>
  </div>
</div>

<router-outlet></router-outlet>
